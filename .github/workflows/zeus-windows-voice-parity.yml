# ZEUS-001 targeted Windows Node-parity regression.
# A real native installer / WSL2 smoke is deliberately out of scope.
name: Zeus Windows voice preferences parity

on:
  pull_request:
    paths:
      - 'apps/desktop/src/store/voice-prefs.test.ts'
      - 'apps/desktop/src/store/voice-prefs.ts'
      - 'apps/desktop/src/lib/storage.ts'
      - 'apps/desktop/vitest.setup.ts'
      - '.github/workflows/zeus-windows-voice-parity.yml'
  push:
    branches: ['work/ZEUS-001-import-brand']
    paths:
      - 'apps/desktop/src/store/voice-prefs.test.ts'
      - 'apps/desktop/src/store/voice-prefs.ts'
      - 'apps/desktop/src/lib/storage.ts'
      - 'apps/desktop/vitest.setup.ts'
      - '.github/workflows/zeus-windows-voice-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zeus-voice-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voice-prefs:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26.4.0']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Record test environment
        run: |
          node --version
          npm --version
          git rev-parse HEAD
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify voice preference storage failure handling
        run: npm run --workspace apps/desktop test:ui -- src/store/voice-prefs.test.ts --reporter=verbose
