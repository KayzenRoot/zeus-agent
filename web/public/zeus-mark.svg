<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="name">
  <title id="name">Zeus Agent</title>
  <defs>
    <linearGradient id="zeus-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0c1018"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="zeus-gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe9b8"/>
      <stop offset=".55" stop-color="#e8c27a"/>
      <stop offset="1" stop-color="#c9963f"/>
    </linearGradient>
    <radialGradient id="zeus-glow" cx="50%" cy="42%" r="62%">
      <stop stop-color="#e8c27a" stop-opacity=".20"/>
      <stop offset="1" stop-color="#e8c27a" stop-opacity="0"/>
    </radialGradient>
    <filter id="zeus-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#zeus-bg)" stroke="#2a2f3d" stroke-width="1.5"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#zeus-glow)"/>
  <circle cx="64" cy="64" r="49" fill="none" stroke="#e8c27a" stroke-opacity=".14" stroke-width="1"/>

  <!-- The Z is the constellation: four anchor nodes joined by one path. -->
  <path d="M38 42H90L38 86H90" fill="none" stroke="url(#zeus-gold)" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="url(#zeus-gold)" opacity=".55" filter="url(#zeus-soft)">
    <circle cx="38" cy="42" r="7"/>
    <circle cx="90" cy="42" r="7"/>
    <circle cx="38" cy="86" r="7"/>
    <circle cx="90" cy="86" r="7"/>
  </g>
  <g fill="#fff4d2">
    <circle cx="38" cy="42" r="3.2"/>
    <circle cx="90" cy="42" r="3.2"/>
    <circle cx="38" cy="86" r="3.2"/>
    <circle cx="90" cy="86" r="3.2"/>
    <circle cx="64" cy="64" r="1.8" opacity=".9"/>
    <circle cx="74" cy="55" r="1.2" opacity=".55"/>
    <circle cx="53" cy="73" r="1.2" opacity=".55"/>
  </g>
</svg>
